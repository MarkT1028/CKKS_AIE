[connectivity]
nk=ct_reader:2:ct_reader_1.ct_reader_2
nk=ct_reduce_accum:2:ct_reduce_accum_1.ct_reduce_accum_2
stream_connect=ct_reader_1.left:ai_engine_0.ckks_left_0
stream_connect=ct_reader_1.right:ai_engine_0.ckks_right_0
stream_connect=ai_engine_0.ckks_partials_0:ct_reduce_accum_1.partials
sp=ct_reader_1.inputs:DDR0
sp=ct_reduce_accum_1.outputs:DDR0
sp=ct_reduce_accum_1.params:DDR0
stream_connect=ct_reader_2.left:ai_engine_0.ckks_left_1
stream_connect=ct_reader_2.right:ai_engine_0.ckks_right_1
stream_connect=ai_engine_0.ckks_partials_1:ct_reduce_accum_2.partials
sp=ct_reader_2.inputs:DDR0
sp=ct_reduce_accum_2.outputs:DDR0
sp=ct_reduce_accum_2.params:DDR0

[clock]
freqHz=225000000:ct_reader_1.ap_clk
freqHz=225000000:ct_reduce_accum_1.ap_clk
freqHz=225000000:ct_reader_2.ap_clk
freqHz=225000000:ct_reduce_accum_2.ap_clk

[vivado]
synth.jobs=1
impl.jobs=1
param=general.maxThreads=2
prop=run.impl_1.strategy=Performance_Explore
